<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic To-Do List</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .todo-container {
            width: 100%;
            max-width: 550px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        .input-section {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        #taskInput {
            flex: 1;
            padding: 13px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        #taskInput:focus {
            border-color: #667eea;
        }

        #addBtn {
            padding: 13px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        #addBtn:hover {
            background: #5568d8;
        }

        #taskList {
            list-style: none;
        }

        .task {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f5f5f5;
            padding: 13px;
            margin-bottom: 10px;
            border-radius: 8px;
        }

        .task-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .task-left input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .task-text {
            font-size: 16px;
            color: #333;
        }

        .completed .task-text {
            text-decoration: line-through;
            color: #999;
        }

        .delete-btn {
            background: #ff4d4d;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #e63939;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #ddd;
            color: #555;
            font-size: 14px;
        }

        .empty-message {
            text-align: center;
            color: #999;
            padding: 20px;
        }

        @media (max-width: 500px) {
            .input-section {
                flex-direction: column;
            }

            #addBtn {
                width: 100%;
            }

            .stats {
                flex-direction: column;
                gap: 5px;
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <div class="todo-container">

        <h1>📝 My To-Do List</h1>

        <!-- Input Section -->
        <div class="input-section">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter a new task..."
            >

            <button id="addBtn">Add Task</button>
        </div>

        <!-- Task List -->
        <ul id="taskList">
            <li class="empty-message">No tasks added yet.</li>
        </ul>

        <!-- Statistics -->
        <div class="stats">
            <span>Total: <b id="totalTasks">0</b></span>
            <span>Completed: <b id="completedTasks">0</b></span>
            <span>Pending: <b id="pendingTasks">0</b></span>
        </div>

    </div>

    <script>
        // Selecting HTML elements using DOM
        const taskInput = document.getElementById("taskInput");
        const addBtn = document.getElementById("addBtn");
        const taskList = document.getElementById("taskList");

        const totalTasks = document.getElementById("totalTasks");
        const completedTasks = document.getElementById("completedTasks");
        const pendingTasks = document.getElementById("pendingTasks");

        // Add Task Function
        function addTask() {

            const taskText = taskInput.value.trim();

            // Check if input is empty
            if (taskText === "") {
                alert("Please enter a task!");
                return;
            }

            // Remove "No tasks added yet" message
            const emptyMessage = document.querySelector(".empty-message");

            if (emptyMessage) {
                emptyMessage.remove();
            }

            // Create new list item
            const li = document.createElement("li");
            li.className = "task";

            // Create left section
            const taskLeft = document.createElement("div");
            taskLeft.className = "task-left";

            // Create checkbox
            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";

            // Create task text
            const span = document.createElement("span");
            span.className = "task-text";
            span.textContent = taskText;

            // Create delete button
            const deleteBtn = document.createElement("button");
            deleteBtn.className = "delete-btn";
            deleteBtn.textContent = "Delete";

            // Add checkbox and text to left section
            taskLeft.appendChild(checkbox);
            taskLeft.appendChild(span);

            // Add everything to list item
            li.appendChild(taskLeft);
            li.appendChild(deleteBtn);

            // Add task to task list
            taskList.appendChild(li);

            // Clear input
            taskInput.value = "";

            // Mark task as completed
            checkbox.addEventListener("change", function () {

                if (checkbox.checked) {
                    li.classList.add("completed");
                } else {
                    li.classList.remove("completed");
                }

                updateStats();
            });

            // Delete task
            deleteBtn.addEventListener("click", function () {
                li.remove();

                // Show empty message if no tasks remain
                if (taskList.children.length === 0) {
                    const message = document.createElement("li");
                    message.className = "empty-message";
                    message.textContent = "No tasks added yet.";
                    taskList.appendChild(message);
                }

                updateStats();
            });

            // Update statistics
            updateStats();
        }

        // Add task when button is clicked
        addBtn.addEventListener("click", addTask);

        // Add task when Enter key is pressed
        taskInput.addEventListener("keypress", function (event) {

            if (event.key === "Enter") {
                addTask();
            }

        });

        // Update task statistics
        function updateStats() {

            const tasks = document.querySelectorAll(".task");

            let completed = 0;

            tasks.forEach(function (task) {

                const checkbox = task.querySelector("input");

                if (checkbox.checked) {
                    completed++;
                }

            });

            const total = tasks.length;
            const pending = total - completed;

            totalTasks.textContent = total;
            completedTasks.textContent = completed;
            pendingTasks.textContent = pending;
        }
    </script>

</body>
</html>
